# Application Properties — no secrets in this file; use env vars or application-local.properties (gitignored).
spring.application.name=certifypro-backend
server.port=${PORT:8080}

# Database (set MYSQL_* for your environment)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/certifypro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT — set JWT_SECRET to a long random string in production
jwt.secret=${JWT_SECRET:change-this-dev-jwt-secret-key-to-a-secure-32-plus-char-value}
jwt.expiration=${JWT_EXPIRATION:604800000}

recaptcha.secret=${RECAPTCHA_SECRET:}
recaptcha.enabled=false

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Email: EMAIL_MOCK=true logs OTPs to console (recommended for local dev)
email.mock=${EMAIL_MOCK:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
email.from=${MAIL_FROM:CertifyPro <noreply@localhost>}

# Admin seed (set ADMIN_SEED_ENABLED=true to create admin + demo data on startup)
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:ChangeMe123!}
admin.name=${ADMIN_NAME:System Admin}
admin.seed-enabled=${ADMIN_SEED_ENABLED:false}

# CORS
frontend.url=${CLIENT_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always
management.health.mail.enabled=${HEALTH_MAIL_ENABLED:false}
management.info.env.enabled=true

# App metadata (shown at /actuator/info)
info.app.name=CertifyPro
info.app.description=Professional certification tracking API
info.app.version=1.0.0

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.certifypro=${LOG_LEVEL_CERTIFYPRO:INFO}
logging.level.org.springframework.security=WARN
